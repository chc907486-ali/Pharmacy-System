# ===================================================================
# 1. PROJECT CONFIGURATION
# ===================================================================
spring.application.name=pharmacy

# ===================================================================
# 2. SERVER PORT CONFIGURATION
# Railway dynamically assigns a port at runtime. 
# ${PORT:8080} ka matlab hai Railway ka port use hoga, local par 8080.
# ===================================================================
server.port=${PORT:8080}

# ===================================================================
# 3. DATABASE CONNECTION (RAILWAY MYSQL)
# Derived from: mysql://root:CGYGCYWWpAeoBexKxfDWxnPVpexjwLhB@roundhouse.proxy.rlwy.net:27255/railway
# ===================================================================
spring.datasource.url=jdbc:mysql://roundhouse.proxy.rlwy.net:27255/railway
spring.datasource.username=root
spring.datasource.password=CGYGCYWWpAeoBexKxfDWxnPVpexjwLhB
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# 4. JPA / HIBERNATE CONFIGURATION
# ddl-auto=update se saare tables database mein automatic create ho jayenge.
# ===================================================================
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===================================================================
# 5. CONNECTION POOL & TIMEOUT FIXES
# Prevents Spring Boot from crashing if the cloud DB takes time to respond.
# ===================================================================
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.maximum-pool-size=10
